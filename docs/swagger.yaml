basePath: /api/v1
definitions:
  dto.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      age:
        example: 30
        maximum: 150
        minimum: 0
        type: integer
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        maxLength: 100
        minLength: 2
        type: string
      gender_id:
        example: 1
        type: integer
      last_name:
        example: Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: password123
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  dto.UpdateUserRequest:
    properties:
      age:
        example: 31
        maximum: 150
        minimum: 0
        type: integer
      birth_day:
        example: "1993-05-30T00:00:00Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        maxLength: 100
        minLength: 2
        type: string
      gender_id:
        example: 1
        type: integer
      last_name:
        example: Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: newpassword123
        maxLength: 72
        minLength: 8
        type: string
    type: object
  dto.UserResponse:
    properties:
      age:
        example: 30
        type: integer
      birth_day:
        example: "1993-05-30T00:00:00Z"
        type: string
      created_at:
        example: "2025-05-30T10:30:00Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      gender_id:
        example: 1
        type: integer
      id:
        example: 1
        type: integer
      last_name:
        example: Doe
        type: string
      updated_at:
        example: "2025-05-30T10:30:00Z"
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A simple backend API written in Go using Gin framework
  title: Golang Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password to get a JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful, JWT token returned
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid email or password
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Invalid request payload or validation error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Auth
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all users in the system
      produces:
      - application/json
      responses:
        "200":
          description: List of users retrieved successfully
          schema:
            items:
              $ref: '#/definitions/dto.UserResponse'
            type: array
        "401":
          description: Unauthorized - token missing or invalid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to load users
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - Users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid user ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - token missing or invalid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
  /users/profile:
    delete:
      consumes:
      - application/json
      description: Delete the account of the currently authenticated user
      produces:
      - application/json
      responses:
        "204":
          description: User account deleted successfully
        "400":
          description: Delete failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - token missing or invalid
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized - token missing or invalid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update the profile information of the currently authenticated user
      parameters:
      - description: Update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User profile updated successfully
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid request payload or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - token missing or invalid
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Enter a valid jwt token to proceed
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
